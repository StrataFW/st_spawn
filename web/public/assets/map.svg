<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%"  stop-color="#1a1f24" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,140,66,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="100%" height="100%" fill="#0d1014"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- abstract "land masses" hinting at LS / Blaine County -->
  <!-- north (Paleto / Mt Chiliad) -->
  <path d="M 200 0 Q 350 80 480 50 T 700 80 T 850 30 L 850 220 Q 750 280 600 250 T 350 220 T 180 250 Z"
        fill="rgba(255,140,66,0.05)" stroke="rgba(255,140,66,0.2)" stroke-width="1.5"/>
  <!-- center (Sandy Shores / desert) -->
  <path d="M 600 280 Q 750 320 850 350 L 880 500 Q 750 520 650 480 T 580 380 Z"
        fill="rgba(255,140,66,0.04)" stroke="rgba(255,140,66,0.18)" stroke-width="1.5"/>
  <!-- south (Los Santos) -->
  <path d="M 220 540 Q 380 520 520 540 T 760 580 L 780 800 Q 700 880 480 850 T 220 800 T 180 700 Z"
        fill="rgba(255,140,66,0.06)" stroke="rgba(255,140,66,0.22)" stroke-width="1.5"/>

  <!-- water hint -->
  <path d="M 0 850 Q 200 870 400 880 T 800 860 T 1000 840 L 1000 1000 L 0 1000 Z"
        fill="rgba(40, 70, 100, 0.25)"/>

  <!-- vignette overlay -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>

  <!-- corner brand -->
  <text x="40" y="970" font-family="monospace" font-size="14" letter-spacing="6"
        fill="rgba(255,255,255,0.25)">STRATA · PLACEHOLDER MAP — replace web/dist/assets/map.svg</text>
</svg>
